apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: nautible
    app.kubernetes.io/managed-by: manual
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: keycloak
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: nautible
        app.kubernetes.io/managed-by: manual
    spec:
      serviceAccountName: keycloak-sa
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.0
          args:
            [
              'start',
              '--import-realm',
              '--hostname-strict=false',
              '--db=postgres',
              '--http-relative-path=/auth',
              '--proxy=edge',
            ]
          # args: ["start-dev","--import-realm","--hostname-strict=false","--db=postgres","--http-relative-path /auth"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: KC_IMPORT_VAL_FRONTEND_URL
              value: http://localhost:8080/api/v1.0/nautible-auth/auth # fix me
            - name: KC_IMPORT_VAL_ROOT_URL
              value: http://localhost:3000 # fix me
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: nautible-plugin-keycloak
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautible-plugin-keycloak
                  key: password
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nautible-plugin-keycloak-db
                  key: user
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautible-plugin-keycloak-db
                  key: password
            - name: KC_DB_URL_HOST
              valueFrom:
                secretKeyRef:
                  name: nautible-plugin-keycloak-db
                  key: host
            - name: PROXY_ADDRESS_FORWARDING
              value: 'true'
          volumeMounts:
            - name: realm
              mountPath: '/opt/keycloak/data/import'
              readOnly: true
            - name: secret-keycloak
              mountPath: '/mnt/secret-store'
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: realm
          emptyDir: {}
        - name: secret-keycloak-realm
          secret:
            secretName: secret-keycloak-realm
        - name: secret-keycloak
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-keycloak
      initContainers:
        - name: touch
          image: busybox
          command:
            [
              'sh',
              '-c',
              'cp /secret-keycloak-realm/realm.json /realm/realm.json',
            ]
          volumeMounts:
            - name: realm
              mountPath: /realm
            - name: secret-keycloak-realm
              mountPath: '/secret-keycloak-realm'
              readOnly: true
        - name: init-secret  
          image: busybox  
          command: ['sh', '-c', 'cat /mnt/secret-store/secret-keycloak > /mnt/secret-store/env-config-keycloak && \  
                              kubectl create secret generic nautible-plugin-keycloak --from-file=secret-keycloak=/mnt/secret-store/env-config-keycloak -o yaml --dry-run=client | kubectl apply -f - && \  
                              cat /mnt/secret-store/secret-keycloak-db > /mnt/secret-store/env-config-keycloak-db && \  
                              kubectl create secret generic nautible-plugin-keycloak-db --from-file=secret-keycloak-db=/mnt/secret-store/env-config-keycloak-db -o yaml --dry-run=client | kubectl apply -f -']  
          volumeMounts:  
          - name: secret-keycloak  
            mountPath: /mnt/secret-store  
          volumes:  
          - name: secret-keycloak  
            csi:  
              driver: secrets-store.csi.k8s.io  
              readOnly: true  
              volumeAttributes:  
                secretProviderClass: secret-keycloak  