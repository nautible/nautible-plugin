---
apiVersion: rbac.authorization.k8s.io/v1  
kind: Role  
metadata:  
  name: secret-manager-role  
  namespace: keycloak  
rules:  
- apiGroups: [""]  
  resources: ["secrets"]  
  verbs: ["create", "get", "update", "delete"]  
---
apiVersion: rbac.authorization.k8s.io/v1  
kind: RoleBinding  
metadata:  
  name: secret-manager-rolebinding  
  namespace: keycloak  
roleRef:  
  apiGroup: rbac.authorization.k8s.io  
  kind: Role  
  name: secret-manager-role  
subjects:  
- kind: ServiceAccount  
  name: keycloak-sa  
  namespace: keycloak  
