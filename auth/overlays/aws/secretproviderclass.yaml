apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-keycloak
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "nautible-plugin-keycloak"
        objectType: "secretsmanager"
      - objectName: "nautible-plugin-keycloak-db"
        objectType: "secretsmanager"
    usePodIdentity: "true"