apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-observability
  namespace: argocd
spec:
  destination:
    namespace: istio-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: service-mesh/observability/overlays/aws
    repoURL: https://github.com/nautible/nautible-plugin
    targetRevision: feature/ambient
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
